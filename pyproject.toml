[project]
name = "yochai-kg-gateway"
version = "0.1.0"
description = "Read-only MCP gateway over the Yochai knowledge graph of the Jewish textual tradition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2.0,<2",  # 2.x renamed FastMCP to MCPServer; the gateway is v1 code
    "neo4j>=5.20",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
yochai-kg-gateway = "gateway.server:main"
yochai-open-server = "gateway.open_server:main"

[tool.setuptools]
packages = ["gateway", "apikeys", "pipeline"]

[tool.setuptools.package-data]
gateway = ["pages/*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Findings in files that predate the plugin work. They are left as they are.
"gateway/tools.py" = ["BLE001"]
"gateway/server.py" = ["BLE001", "E302", "E305"]
"tests/live_smoke.py" = ["EXE001", "SIM117", "I001"]
"tests/test_tools_smoke.py" = ["I001"]
"submitted_texts/validate_submission.py" = ["EXE001", "I001", "FURB167"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
