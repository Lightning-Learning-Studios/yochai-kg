[project]
name = "yochai-kg-gateway"
version = "0.1.0"
description = "Read-only MCP gateway over the Yochai knowledge graph of the Jewish textual tradition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2.0,<2",
    "neo4j>=5.20",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
yochai-kg-gateway = "gateway.server:main"

[tool.setuptools]
packages = ["gateway", "apikeys"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
