name: Community skills

# Turns approved Yochai Create skills into pull requests against the plugin shelf.
# Gates: (1) a Yochai reviewer published it, (2) the author gave consent,
# (3) the safety check passed, (4) a person merges the pull request.
# This workflow opens and updates pull requests. It never merges.
#
# Setup, once:
#   - Repository variable YOCHAI_API_URL: the base address of the Yochai service.
#   - Settings, Actions, General: allow GitHub Actions to create pull requests.
#   - Optional repository secret ANTHROPIC_API_KEY: turns on the model review.

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the result only. Open no pull requests."
        type: boolean
        default: false

permissions:
  contents: write # push the community-skill/<slug> branches
  pull-requests: write # open and update pull requests

concurrency:
  group: community-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOCHAI_API_URL: ${{ vars.YOCHAI_API_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Stop when the feed address is not set
        id: guard
        run: |
          if [ -z "$YOCHAI_API_URL" ]; then
            echo "::notice::The repository variable YOCHAI_API_URL is not set. Nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.11"

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: python -m pip install --quiet "httpx>=0.27"

      - name: Run the pipeline
        if: steps.guard.outputs.ready == 'true'
        run: |
          python -m pipeline.run --report "$RUNNER_TEMP/report.json" | tee "$RUNNER_TEMP/summary.txt"
          {
            echo "## Community skills run"
            echo
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/generated"
          if [ -d shelf/community ]; then cp -R shelf/community/. "$RUNNER_TEMP/generated/"; fi

      - name: Open or update one pull request per skill
        if: steps.guard.outputs.ready == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pipeline.open_prs --report "$RUNNER_TEMP/report.json" --generated "$RUNNER_TEMP/generated" --base main
