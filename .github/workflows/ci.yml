name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Validate submitted-texts examples
        run: |
          pip install pyyaml
          if ls submitted_texts/*.yaml >/dev/null 2>&1; then
            python submitted_texts/validate_submission.py submitted_texts/*.yaml
          else
            echo "no submissions to validate"
          fi
